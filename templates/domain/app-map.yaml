# App map — seeded from route config (0.2), filled by the live crawl (/qa-domain crawl, live-crawl.md)
# and by exploratory sessions (app-map DCPs, auto level).
baseUrls:
  test: "{{https://test.example.com}}"
pages:
  - id: PAGE-leave-new
    path: "/leave/new"
    title: "New leave request"
    features: [F-leave-request]
    roles: [ROLE-employee, ROLE-manager]
    navigation: ["Home > Leave > New"]
    keyElements:
      - { name: "Start date", role: textbox }
      - { name: "Submit", role: button }
    screenshots: []                 # app-map/screenshots/<page>-<role>.png
    source: route-config           # route-config | crawl | manual
    lastVerified: "{{isoDate}}"
