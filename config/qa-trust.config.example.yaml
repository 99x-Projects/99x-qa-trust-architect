# qa-trust.config.yaml — place at the root of the project under test.
# Validated by schemas/qa-trust.config.schema.json. All paths are relative to the project root.

version: 1

project:
  name: "My Project"
  type: auto                      # auto | greenfield | brownfield

# ─── Where artifacts live ───────────────────────────────────────────────
storage:
  repo:
    enabled: true
    path: "docs/qa"               # any folder
    layout: "{workItemKey}/"      # e.g. "{epic}/{workItemKey}/" or "{intent}/{unit}/" (AI-DLC)
  platform:
    enabled: true
    target: azure-devops          # azure-devops (MVP) | jira-xray (v2) | github (v3)
  sourceOfTruth: repo             # repo | platform
  syncMode: on-gate               # on-gate | on-demand | manual

# ─── Secrets ────────────────────────────────────────────────────────────
# Secrets (PATs, tokens, test account passwords) live ONLY in the env file, never here.
# Template: config/.env.example in the plugin. Shell/OS environment variables win over the file.
secrets:
  envFile: ".env"                 # relative to project root; must be gitignored

# ─── Work item platform connection ──────────────────────────────────────
platform:
  azure-devops:
    organization: "https://dev.azure.com/your-org"
    project: "YourProject"
    testPlanId: null              # existing Test Plan to add suites/cases to (null = create per work item)
    workItemKeyPrefix: "ADO"      # folder key → ADO-1234
    gateStatusField: tag          # tag | custom-field
    customFieldRef: null          # e.g. "Custom.QAGate" when gateStatusField = custom-field
    defectType: "Bug"             # work item type for defects ("Issue" in the Basic process)
    defectLinkToRequirement: related   # related | none — Bug ↔ story link
    copyAreaIteration: true       # new bugs inherit Area/Iteration from the story
  # jira-xray: { site, projectKey, xrayDeployment: cloud|server, ... }   # v2
  # github:    { owner, repo }                                            # v3

# ─── Gates ──────────────────────────────────────────────────────────────
gates:
  mode: advisory                  # advisory | blocking (per-gate override below)
  perGate: {}                     # e.g. { G4: blocking }
  approvers:
    default: any-tester
    overrides: {}                 # e.g. { G4: ["qa-lead"] }
  team:
    testers: ["*"]                # or explicit list of names/emails

# ─── Acceptance criteria ────────────────────────────────────────────────
acceptanceCriteria:
  formats: [gherkin, rule-table]  # both allowed, chosen per criterion
  pushToPlatform: true            # write approved AC back to the work item at G1

# ─── Routing / tiers ────────────────────────────────────────────────────
routing:
  defaultTier: standard
  rules:
    - when: { type: [Bug, Hotfix] }
      tier: light
    - when: { type: [Epic, Feature] }
      tier: comprehensive
    - when: { labels: [payments, pii, compliance, security] }
      tier: comprehensive

# ─── Domain context ─────────────────────────────────────────────────────
domain:
  path: "docs/qa/_project/domain"
  discovery:
    mode: auto                    # auto | docs-led | evidence-led
    depth:
      skeleton: all-features
      deep: [top-risk, top-usage]
      lazy: true                  # deepen a feature on its first work item
    sources:
      docs: ["docs/**/*.md", "requirements/**"]
      tests: true
      code: true
      dataModel: true
      trackerHistory: { lookbackMonths: 12 }
      liveApp: false              # true → /qa-init runs the Playwright live crawl per role (needs a running env)
    crawl:
      maxPages: 60                # per role
      maxDepth: 4
      roles: all                  # all | [ROLE-employee, ROLE-manager]
    corroboration:
      highConfidence: 2           # independent sources needed for "high"
  proposals:
    autoAccept: [app-map.pages, app-map.screenshots, feature-map.codeLinks, typo]
    review:     [glossary, journeys, entities, known-quirks, integrations, personas]
    critical:   [business-rules, personas-roles.permissions, entities.states]
    staleAfterDays: 7
  owners: {}                      # e.g. { business-rules: ["product-owner"] }; default any tester
  provisionalFacts:
    usableByAgents: true
    canFailTests: false
  notifyPlatform: comment         # none | comment | work-item

# ─── Other SDLC workflows ───────────────────────────────────────────────
integrations:
  aidlc:
    enabled: auto                 # auto | true | false
    mode: companion               # companion (MVP) | embedded (v3)
    docsPath: "aidlc-docs"
    keyBy: unit                   # unit | workItem
    unitToWorkItem: from-tracker
    writeBack:
      questions: false            # v2
      auditEntries: false
    gateAlignment: false          # v2
    domainSync: dcp

# ─── Execution: manual runs, defects, regression (v2) ───────────────────
execution:
  defaultEnvironment: test        # must be in domain/environments.yaml with agentsAllowed or used by testers
  evidencePath: "3-execution/evidence"   # relative to the work item folder
  manualMode: ask                 # interactive (step by step in chat) | sheet (offline file) | ask
  publishRuns: on-gate            # on-gate (G4) | after-session | manual (/qa-sync --what runs)
  flakyReruns: 1                  # automated failures re-run this many times before triage as product defect
  defects:
    autoDraft: true               # draft DEF-xxx for each failed run (never created without confirmation)
    duplicateCheck: true          # search the platform for similar open defects first
    requireReproduction: false    # true → a failure must be reproduced once before confirmation
    attachEvidence: true          # upload screenshots/logs as attachments
    refreshStatusOnStatus: true   # /qa-status reads defect states from the platform
  results:
    formats: [junit, trx]         # automated result files the importer understands
    paths: ["**/TestResults/*.trx", "**/junit*.xml", "**/test-results/*.xml"]

# ─── Exploratory testing via Playwright MCP (v2) ────────────────────────
exploratory:
  mcp: playwright                 # MCP server name (plugin default; see auth.roles for per-role servers)
  environments:
    allowed: [dev, test, staging] # AND environments.yaml → agentsAllowed: true. Production is always refused.
  allowedOrigins: []              # extra origins besides the env base URL, e.g. ["https://login.microsoftonline.com"]
  auth:
    strategy: manual              # manual (tester logs in in the browser window) | storage-state
    storageStatePath: ".auth/{env}-{role}.json"   # recorded by the tester; gitignored; never read by the AI
    roles: {}                     # storage-state only, e.g. { ROLE-employee: { mcpServer: playwright-employee } }
  guards:
    blockActions: ["delete", "remove", "pay", "purchase", "transfer", "send email", "send notification",
                   "deactivate", "approve payment", "purge"]
    maxSessionMinutes: 30
    maxActions: 150
  sessions:
    defaultMode: ask              # autonomous | guided | pair | ask
    mandatoryCharters: high-risk  # high-risk | all | none
  defectCreation: confirm         # always confirm — not configurable to auto
